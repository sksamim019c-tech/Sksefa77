name: DARK MYRAA Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Existing Project
        shell: pwsh
        run: |
          Expand-Archive DARK-MYRAA-modified-project.zip bundle
          $zip = Get-ChildItem bundle -Recurse -Filter "MYRAA-Mobile-SKSEFA-HACKINGCYBER-source.zip" | Select-Object -First 1
          if (!$zip) { throw "Source ZIP not found" }
          Expand-Archive $zip.FullName project

      - name: Remove Missing Evelyn Dependency
        shell: pwsh
        run: |
          $script = "project/scripts/build-android.ps1"
          $lines = Get-Content $script
          $lines = $lines | Where-Object { $_ -notmatch "Copy-Item.*assets.*characters.*evelyn" }
          Set-Content -Path $script -Value $lines

      - name: Install Dependencies
        working-directory: project
        run: npm ci

      - name: Build DARK MYRAA APK
        working-directory: project
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/build-android.ps1 -SdkRoot $env:ANDROID_HOME -JavaRoot $env:JAVA_HOME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK-MYRAA-DEBUG-APK
          path: project/artifacts/android/*.apk
          if-no-files-found: error
          
