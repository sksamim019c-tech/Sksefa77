name: DARK MYRAA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build DARK MYRAA
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Components
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK installation failed"
          }

      - name: Extract Existing Project
        shell: pwsh
        run: |
          if (!(Test-Path "DARK-MYRAA-modified-project.zip")) {
            throw "Project ZIP not found"
          }

          Expand-Archive "DARK-MYRAA-modified-project.zip" "bundle" -Force

          $zip = Get-ChildItem "bundle" -Recurse -Filter "MYRAA-Mobile-SKSEFA-HACKINGCYBER-source.zip" |
            Select-Object -First 1

          if (!$zip) {
            throw "Original source ZIP not found"
          }

          Expand-Archive $zip.FullName "project" -Force

      - name: Check Android Build Script
        shell: pwsh
        run: |
          if (!(Test-Path "project/scripts/build-android.ps1")) {
            throw "Android build script not found"
          }

          if (!(Test-Path "project/package.json")) {
            throw "package.json not found"
          }

      - name: Remove Missing Evelyn Dependency
        shell: pwsh
        run: |
          $script = "project/scripts/build-android.ps1"
          $content = Get-Content $script

          $content = $content | Where-Object {
            $_ -notmatch "Copy-Item.*assets.*characters.*evelyn"
          }

          Set-Content -Path $script -Value $content

      - name: Install Project Dependencies
        working-directory: project
        shell: pwsh
        run: |
          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "NPM installation failed"
          }

      - name: Build DARK MYRAA APK
        working-directory: project
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-android.ps1 -SdkRoot $env:ANDROID_HOME -JavaRoot $env:JAVA_HOME

          if ($LASTEXITCODE -ne 0) {
            throw "Android APK build failed"
          }

      - name: Find Generated APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem "project" -Recurse -Filter "*.apk" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$apk) {
            throw "APK was not generated"
          }

          New-Item -ItemType Directory -Force -Path "output" | Out-Null

          Copy-Item $apk.FullName "output/DARK-MYRAA.apk" -Force

          "path=output/DARK-MYRAA.apk" >> $env:GITHUB_OUTPUT

          Write-Host "APK found: $($apk.FullName)"

      - name: Upload DARK MYRAA APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK-MYRAA-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
          
